{% extends "base.html" %}
{% block title %}Aptitude Practice – {{ config.APP_NAME }}{% endblock %}
{% block content %}
<section class="section dashboard">
  <div class="container">
    <h1 class="fw-bold">Aptitude Practice</h1>
    <p class="text-muted mb-4">Pick a category and difficulty. Each quiz is timed and scored automatically.</p>
    <div class="row g-4">
      {% for c in categories %}
      <div class="col-md-6 col-lg-4">
        <div class="card feature-card h-100">
          <div class="card-body p-4 d-flex flex-column">
            <div class="feature-icon mb-3"><i class="bi {{ c.icon }}"></i></div>
            <h5 class="fw-semibold">{{ c.name }}</h5>
            <p class="text-muted">{{ c.text }}</p>
            <form method="post" action="{{ url_for('aptitude.start') }}" class="mt-auto">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <input type="hidden" name="category" value="{{ c.name }}">
              <label class="form-label small fw-medium" for="diff-{{ loop.index }}">Difficulty</label>
              <select class="form-select mb-3" name="difficulty" id="diff-{{ loop.index }}">
                {% for d in difficulties %}<option value="{{ d }}" {{ 'selected' if d == 'Mixed' }}>{{ d }}</option>{% endfor %}
              </select>
              <button type="submit" class="btn btn-primary-custom w-100">Start quiz</button>
            </form>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
